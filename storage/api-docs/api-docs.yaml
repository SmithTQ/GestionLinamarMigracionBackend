components:
  schemas:
    CampaignResource:
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          example: CAMP-001
        name:
          type: string
          example: 'Campaña de ejemplo'
        budget:
          type: string
          example: '2500.00'
          nullable: true
        orders_count:
          type: integer
          example: 12
        delivered_count:
          type: integer
          example: 8
        total_obtained:
          type: string
          example: '1250.00'
          nullable: true
        status:
          type: string
          example: open
        form_status:
          type: string
          example: published
          nullable: true
        has_published_form:
          type: boolean
          example: true
      type: object
  securitySchemes:
    sanctum:
      type: http
      description: 'Token personal emitido por Laravel Sanctum'
      bearerFormat: token
      scheme: bearer
