openapi: 3.0.0
info:
  title: 'Gestor de Pedidos Linamar API'
  description: 'Contrato HTTP del backend separado para la gestión de pedidos.'
  contact:
    email: soporte@linamar.local
  version: 0.1.0
servers:
  -
    url: 'http://localhost:8000'
    description: 'Entorno local Docker'
paths:
  /api/v1/auth/login:
    post:
      tags:
        - Autenticación
      summary: 'Iniciar sesión'
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - login
                - password
              properties:
                login:
                  type: string
                  example: usuario@linamar.test
                password:
                  type: string
                  format: password
                  example: contraseña
              type: object
      responses:
        200:
          description: 'Sesión iniciada'
        422:
          description: 'Datos inválidos'
        429:
          description: 'Demasiados intentos'
  /api/v1/auth/logout:
    post:
      tags:
        - Autenticación
      summary: 'Cerrar la sesión actual'
      operationId: logout
      responses:
        200:
          description: 'Sesión cerrada'
        401:
          description: 'No autenticado'
      security:
        -
          sanctum: []
  /api/v1/auth/me:
    get:
      tags:
        - Autenticación
      summary: 'Obtener el usuario autenticado'
      operationId: me
      responses:
        200:
          description: 'Usuario autenticado'
        401:
          description: 'No autenticado'
      security:
        -
          sanctum: []
  /api/v1/branches:
    get:
      tags:
        - Sucursales
      summary: 'Listar sucursales'
      operationId: listBranches
      responses:
        200:
          description: 'Sucursales obtenidas'
    post:
      tags:
        - Sucursales
      summary: 'Crear sucursal'
      operationId: createBranch
      responses:
        201:
          description: 'Sucursal creada'
  '/api/v1/branches/{branch}':
    get:
      tags:
        - Sucursales
      summary: 'Consultar sucursal'
      operationId: showBranch
      responses:
        200:
          description: 'Sucursal obtenida'
    delete:
      tags:
        - Sucursales
      summary: 'Desactivar sucursal'
      operationId: archiveBranch
      responses:
        200:
          description: 'Sucursal desactivada'
    patch:
      tags:
        - Sucursales
      summary: 'Actualizar sucursal'
      operationId: updateBranch
      responses:
        200:
          description: 'Sucursal actualizada'
  /api/v1/campaigns/available:
    get:
      tags:
        - CampaÃ±as
      summary: 'Listar campaÃ±as disponibles para el usuario'
      operationId: listAvailableCampaigns
      responses:
        200:
          description: 'CampaÃ±as disponibles'
  /api/v1/campaigns:
    get:
      tags:
        - Campañas
      summary: 'Listar campañas'
      operationId: listCampaigns
      responses:
        200:
          description: 'Campañas obtenidas'
    post:
      tags:
        - Campañas
      summary: 'Crear campaña'
      operationId: createCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - code
                - name
                - branch_id
              properties:
                code:
                  type: string
                  example: CAMPANA_ENERO
                name:
                  type: string
                  example: 'Pedidos de enero'
                status:
                  type: string
                  example: draft
                starts_on:
                  type: string
                  format: date
                  nullable: true
                ends_on:
                  type: string
                  format: date
                  nullable: true
                branch_id:
                  type: integer
                  example: 1
                district_list_ids:
                  type: array
                  items:
                    type: integer
                  example:
                    - 4
                    - 5
              type: object
      responses:
        201:
          description: 'Campaña creada'
  '/api/v1/campaigns/{campaign}':
    get:
      tags:
        - Campañas
      summary: 'Consultar campaña'
      operationId: showCampaign
      responses:
        200:
          description: 'Campaña obtenida'
    delete:
      tags:
        - Campañas
      summary: 'Cerrar campaña'
      operationId: archiveCampaign
      responses:
        200:
          description: 'Campaña cerrada'
    patch:
      tags:
        - Campañas
      summary: 'Actualizar campaña'
      operationId: updateCampaign
      requestBody:
        content:
          application/json:
            schema:
              properties:
                code:
                  type: string
                name:
                  type: string
                status:
                  type: string
                starts_on:
                  type: string
                  format: date
                  nullable: true
                ends_on:
                  type: string
                  format: date
                  nullable: true
                branch_id:
                  type: integer
                district_list_ids:
                  type: array
                  items:
                    type: integer
              type: object
      responses:
        200:
          description: 'Campaña actualizada'
  '/api/v1/campaigns/{campaign}/available-dispatchers':
    get:
      tags:
        - 'Usuarios de campaña'
      summary: 'Listar despachadores disponibles para la campaña'
      operationId: listAvailableCampaignDispatchers
      responses:
        200:
          description: 'Despachadores disponibles'
  '/api/v1/campaigns/{campaign}/users':
    get:
      tags:
        - 'Usuarios de campaÃ±a'
      summary: 'Listar usuarios asignados a una campaÃ±a'
      operationId: listCampaignUsers
      responses:
        200:
          description: 'Usuarios obtenidos'
    post:
      tags:
        - 'Usuarios de campaÃ±a'
      summary: 'Asignar usuario a una campaÃ±a'
      operationId: assignCampaignUser
      responses:
        201:
          description: 'Usuario asignado'
        409:
          description: 'AsignaciÃ³n duplicada'
  '/api/v1/campaigns/{campaign}/users/{user}':
    delete:
      tags:
        - 'Usuarios de campaÃ±a'
      summary: 'Desactivar usuario de una campaÃ±a'
      operationId: removeCampaignUser
      responses:
        200:
          description: 'AsignaciÃ³n desactivada'
  /api/v1/districts/departments:
    get:
      tags:
        - Distritos
      summary: 'Listar departamentos'
      operationId: listDistrictDepartments
      responses:
        200:
          description: 'Departamentos obtenidos'
  /api/v1/districts/provinces:
    get:
      tags:
        - Distritos
      summary: 'Listar provincias por departamento'
      operationId: listDistrictProvinces
      parameters:
        -
          name: department_code
          in: query
          required: true
          schema:
            type: string
            example: '15'
      responses:
        200:
          description: 'Provincias obtenidas'
  /api/v1/districts:
    get:
      tags:
        - Distritos
      summary: 'Listar distritos'
      operationId: listDistricts
      responses:
        200:
          description: 'Distritos obtenidos'
    post:
      tags:
        - Distritos
      summary: 'Crear distrito'
      operationId: createDistrict
      responses:
        201:
          description: 'Distrito creado'
  '/api/v1/districts/{district}':
    get:
      tags:
        - Distritos
      summary: 'Consultar distrito'
      operationId: showDistrict
      responses:
        200:
          description: 'Distrito obtenido'
    delete:
      tags:
        - Distritos
      summary: 'Desactivar distrito'
      operationId: archiveDistrict
      responses:
        200:
          description: 'Distrito desactivado'
    patch:
      tags:
        - Distritos
      summary: 'Actualizar distrito'
      operationId: updateDistrict
      responses:
        200:
          description: 'Distrito actualizado'
  /api/v1/district-lists:
    get:
      tags:
        - 'Plantillas de distritos'
      summary: 'Listar plantillas de distritos'
      operationId: listDistrictLists
      responses:
        200:
          description: 'Plantillas obtenidas'
    post:
      tags:
        - 'Plantillas de distritos'
      summary: 'Crear plantilla de distritos'
      operationId: createDistrictList
      responses:
        201:
          description: 'Plantilla creada'
  '/api/v1/district-lists/{districtList}':
    get:
      tags:
        - 'Plantillas de distritos'
      summary: 'Consultar plantilla de distritos'
      operationId: showDistrictList
      responses:
        200:
          description: 'Plantilla obtenida'
    delete:
      tags:
        - 'Plantillas de distritos'
      summary: 'Desactivar plantilla de distritos'
      operationId: archiveDistrictList
      responses:
        200:
          description: 'Plantilla desactivada'
    patch:
      tags:
        - 'Plantillas de distritos'
      summary: 'Actualizar plantilla de distritos'
      operationId: updateDistrictList
      responses:
        200:
          description: 'Plantilla actualizada'
  /api/v1/product-categories:
    get:
      tags:
        - Productos
      summary: 'Listar categorías'
      operationId: listProductCategories
      responses:
        200:
          description: 'Categorías obtenidas'
    post:
      tags:
        - Productos
      summary: 'Crear categoría'
      operationId: createProductCategory
      responses:
        201:
          description: 'Categoría creada'
  '/api/v1/product-categories/{category}':
    delete:
      tags:
        - Productos
      summary: 'Desactivar categoría'
      operationId: deleteProductCategory
      responses:
        200:
          description: 'Categoría desactivada'
    patch:
      tags:
        - Productos
      summary: 'Actualizar categoría'
      operationId: updateProductCategory
      responses:
        200:
          description: 'Categoría actualizada'
  /api/v1/product-subcategories:
    get:
      tags:
        - Productos
      summary: 'Listar subcategorías'
      operationId: listProductSubcategories
      responses:
        200:
          description: 'Subcategorías obtenidas'
    post:
      tags:
        - Productos
      summary: 'Crear subcategoría'
      operationId: createProductSubcategory
      responses:
        201:
          description: 'Subcategoría creada'
  '/api/v1/product-subcategories/{subcategory}':
    delete:
      tags:
        - Productos
      summary: 'Desactivar subcategoría'
      operationId: deleteProductSubcategory
      responses:
        200:
          description: 'Subcategoría desactivada'
    patch:
      tags:
        - Productos
      summary: 'Actualizar subcategoría'
      operationId: updateProductSubcategory
      responses:
        200:
          description: 'Subcategoría actualizada'
  /api/v1/products:
    get:
      tags:
        - Productos
      summary: 'Listar productos'
      operationId: listProducts
      responses:
        200:
          description: 'Productos obtenidos'
    post:
      tags:
        - Productos
      summary: 'Crear producto'
      operationId: createProduct
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - name
              properties:
                name:
                  type: string
                  example: 'Caja de rosas'
                branch_id:
                  type: integer
                  example: 2
                subcategory_id:
                  type: integer
                  example: 1
                  nullable: true
                sku:
                  type: string
                  example: PROD-000001
                  nullable: true
                slug:
                  type: string
                  example: caja-de-rosas
                  nullable: true
                description:
                  type: string
                  nullable: true
                unit:
                  type: string
                  example: unidad
                base_price:
                  type: number
                  format: float
                  example: 59.9
                  nullable: true
                sort_order:
                  type: integer
                  example: 0
                image:
                  type: string
                  format: binary
                  nullable: true
              type: object
      responses:
        201:
          description: 'Producto creado'
  '/api/v1/products/{product}':
    delete:
      tags:
        - Productos
      summary: 'Desactivar producto'
      operationId: deleteProduct
      responses:
        200:
          description: 'Producto desactivado'
    patch:
      tags:
        - Productos
      summary: 'Actualizar producto'
      operationId: updateProduct
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                name:
                  type: string
                subcategory_id:
                  type: integer
                  nullable: true
                slug:
                  type: string
                  nullable: true
                description:
                  type: string
                  nullable: true
                unit:
                  type: string
                base_price:
                  type: number
                  format: float
                  nullable: true
                sort_order:
                  type: integer
                is_active:
                  type: boolean
                image:
                  type: string
                  format: binary
                  nullable: true
              type: object
      responses:
        200:
          description: 'Producto actualizado'
  '/api/v1/campaigns/{campaign}/products':
    get:
      tags:
        - Productos
      summary: 'Listar productos de campaña'
      operationId: listCampaignProducts
      responses:
        200:
          description: 'Productos de campaña obtenidos'
    put:
      tags:
        - Productos
      summary: 'Configurar productos de campaña'
      operationId: assignCampaignProducts
      responses:
        200:
          description: 'Productos de campaña actualizados'
  /api/v1/customers:
    get:
      tags:
        - 'Clientes e invitaciones'
      summary: 'Listar clientes'
      operationId: listCustomers
      responses:
        200:
          description: 'Clientes obtenidos'
  '/api/v1/customers/{customer}':
    get:
      tags:
        - 'Clientes e invitaciones'
      summary: 'Consultar cliente e historial'
      operationId: showCustomer
      responses:
        200:
          description: 'Cliente obtenido'
  /api/v1/customer-invitations:
    get:
      tags:
        - 'Clientes e invitaciones'
      summary: 'Listar invitaciones'
      operationId: listCustomerInvitations
      responses:
        200:
          description: 'Invitaciones obtenidas'
    post:
      tags:
        - 'Clientes e invitaciones'
      summary: 'Generar invitación de WhatsApp'
      operationId: createCustomerInvitation
      responses:
        201:
          description: 'Invitación generada'
  '/api/v1/customer-invitations/{invitation}/revoke':
    post:
      tags:
        - 'Clientes e invitaciones'
      summary: 'Revocar invitación'
      operationId: revokeCustomerInvitation
      responses:
        200:
          description: 'Invitación revocada'
  /api/v1/couriers:
    get:
      tags:
        - Motorizados
      summary: 'Listar motorizados'
      operationId: listCouriers
      responses:
        200:
          description: 'Motorizados obtenidos'
    post:
      tags:
        - Motorizados
      summary: 'Crear motorizado'
      operationId: createCourier
      responses:
        201:
          description: 'Motorizado creado'
  '/api/v1/couriers/{courier}':
    patch:
      tags:
        - Motorizados
      summary: 'Actualizar motorizado'
      operationId: updateCourier
      responses:
        200:
          description: 'Motorizado actualizado'
  '/api/v1/routes/{route}/access-token':
    post:
      tags:
        - Rutas
      summary: 'Crear enlace público seguro para una ruta'
      operationId: createRouteAccessToken
      responses:
        201:
          description: 'Enlace creado'
    delete:
      tags:
        - Rutas
      summary: 'Revocar enlace público de una ruta'
      operationId: revokeRouteAccessToken
      responses:
        200:
          description: 'Enlace revocado'
  '/api/v1/routes/{route}/courier-invitations':
    post:
      tags:
        - Rutas
      summary: 'Asignar motorizado y generar invitación pública de ruta'
      operationId: createCourierRouteInvitation
      responses:
        201:
          description: 'Motorizado asignado e invitación generada'
  /api/v1/routes/eligible-orders:
    get:
      tags:
        - Rutas
      summary: 'Listar pedidos elegibles para enrutar'
      operationId: listEligibleRouteOrders
      responses:
        200:
          description: 'Pedidos elegibles obtenidos'
  /api/v1/routes/map-orders:
    get:
      tags:
        - Rutas
      summary: 'Listar pedidos ubicables para el mapa de rutas'
      operationId: listMapRouteOrders
      parameters:
        -
          name: campaign_id
          in: query
          required: true
          schema:
            type: integer
            example: 1
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            example: 1
            minimum: 1
        -
          name: per_page
          in: query
          required: false
          schema:
            type: integer
            example: 20
            maximum: 100
            minimum: 1
        -
          name: search
          in: query
          required: false
          schema:
            type: string
            example: Maria
        -
          name: delivery_date
          in: query
          required: false
          schema:
            type: string
            format: date
            example: '2026-09-20'
        -
          name: district_id
          in: query
          required: false
          schema:
            type: integer
            example: 15
      responses:
        200:
          description: 'Pedidos ubicables y resumen del mapa obtenidos'
  /api/v1/routes/generate:
    post:
      tags:
        - Rutas
      summary: 'Generar ruta desde pedidos seleccionados'
      operationId: generateRoute
      responses:
        201:
          description: 'Ruta generada'
        200:
          description: 'Solicitud ya procesada'
  '/api/v1/routes/{route}/stops':
    put:
      tags:
        - Rutas
      summary: 'Modificar paradas de una ruta'
      operationId: updateRouteStops
      responses:
        200:
          description: 'Paradas actualizadas'
  /api/v1/routes:
    get:
      tags:
        - Rutas
      summary: 'Listar rutas'
      operationId: listRoutes
      responses:
        200:
          description: 'Rutas obtenidas'
    post:
      tags:
        - Rutas
      summary: 'Crear ruta'
      operationId: createRoute
      responses:
        201:
          description: 'Ruta creada'
  '/api/v1/routes/{route}':
    get:
      tags:
        - Rutas
      summary: 'Consultar ruta'
      operationId: showRoute
      responses:
        200:
          description: 'Ruta obtenida'
    patch:
      tags:
        - Rutas
      summary: 'Actualizar ruta'
      operationId: updateRoute
      responses:
        200:
          description: 'Ruta actualizada'
  '/api/v1/routes/{route}/courier':
    patch:
      tags:
        - Rutas
      summary: 'Asignar motorizado'
      operationId: assignCourier
      responses:
        200:
          description: 'Motorizado asignado'
  '/api/v1/routes/{route}/orders':
    post:
      tags:
        - Rutas
      summary: 'Agregar pedidos a una ruta'
      operationId: attachOrders
      responses:
        200:
          description: 'Pedidos agregados'
  '/api/v1/routes/{route}/status':
    patch:
      tags:
        - Rutas
      summary: 'Cambiar estado de ruta'
      operationId: changeRouteStatus
      responses:
        200:
          description: 'Estado actualizado'
  '/api/v1/public/routes/{token}':
    get:
      tags:
        - 'Public routes'
      summary: 'Consultar ruta mediante token seguro'
      operationId: showPublicRoute
      responses:
        200:
          description: 'Ruta publica obtenida'
  '/api/v1/public/routes/{token}/orders/{order}/delivery-confirmation':
    post:
      tags:
        - 'Public routes'
      summary: 'Confirmar entrega con evidencia'
      operationId: confirmPublicDelivery
      responses:
        200:
          description: 'Entrega confirmada'
  /api/v1/campaign-forms:
    get:
      tags:
        - Formularios
      summary: 'Listar formularios'
      operationId: listCampaignForms
      responses:
        200:
          description: 'Formularios obtenidos'
    post:
      tags:
        - Formularios
      summary: 'Crear formulario'
      operationId: createCampaignForm
      responses:
        201:
          description: 'Formulario creado'
  '/api/v1/campaigns/{campaign}/configuration':
    put:
      tags:
        - Formularios
      summary: 'Guardar formulario y productos de campaña de forma atómica'
      operationId: configureCampaignFormAndProducts
      responses:
        200:
          description: 'Configuración guardada'
  '/api/v1/campaign-forms/{form}':
    get:
      tags:
        - Formularios
      summary: 'Consultar formulario'
      operationId: showCampaignForm
      responses:
        200:
          description: 'Formulario obtenido'
    patch:
      tags:
        - Formularios
      summary: 'Actualizar formulario'
      operationId: updateCampaignForm
      responses:
        200:
          description: 'Formulario actualizado'
  '/api/v1/campaign-forms/{form}/publish':
    post:
      tags:
        - Formularios
      summary: 'Publicar formulario'
      operationId: publishCampaignForm
      responses:
        200:
          description: 'Formulario publicado'
  '/api/v1/campaign-forms/{form}/close':
    post:
      tags:
        - Formularios
      summary: 'Cerrar formulario'
      operationId: closeCampaignForm
      responses:
        200:
          description: 'Formulario cerrado'
  /api/v1/form-templates:
    get:
      tags:
        - Formularios
      summary: 'Listar plantillas'
      operationId: listFormTemplates
      responses:
        200:
          description: 'Plantillas obtenidas'
    post:
      tags:
        - Formularios
      summary: 'Crear plantilla'
      operationId: createFormTemplate
      responses:
        201:
          description: 'Plantilla creada'
  '/api/v1/form-templates/{template}':
    get:
      tags:
        - Formularios
      summary: 'Consultar plantilla'
      operationId: showFormTemplate
      responses:
        200:
          description: 'Plantilla obtenida'
    delete:
      tags:
        - Formularios
      summary: 'Desactivar plantilla'
      operationId: deactivateFormTemplate
      responses:
        200:
          description: 'Plantilla desactivada'
    patch:
      tags:
        - Formularios
      summary: 'Actualizar plantilla'
      operationId: updateFormTemplate
      responses:
        200:
          description: 'Plantilla actualizada'
  '/api/v1/form-templates/{template}/fields':
    get:
      tags:
        - Formularios
      summary: 'Listar campos de plantilla'
      operationId: listFormTemplateFields
      responses:
        200:
          description: 'Campos obtenidos'
    post:
      tags:
        - Formularios
      summary: 'Crear campo de plantilla'
      operationId: createFormTemplateField
      responses:
        201:
          description: 'Campo creado'
  '/api/v1/form-templates/{template}/fields/{field}':
    delete:
      tags:
        - Formularios
      summary: 'Desactivar campo de plantilla'
      operationId: deactivateFormTemplateField
      responses:
        200:
          description: 'Campo desactivado'
    patch:
      tags:
        - Formularios
      summary: 'Actualizar campo de plantilla'
      operationId: updateFormTemplateField
      responses:
        200:
          description: 'Campo actualizado'
  '/api/v1/public/invitations/{token}':
    get:
      tags:
        - 'Formularios públicos'
      summary: 'Consultar invitación'
      operationId: showPublicInvitation
      responses:
        200:
          description: 'Invitación obtenida'
  '/api/v1/public/invitations/{token}/submissions':
    post:
      tags:
        - 'Formularios públicos'
      summary: 'Enviar invitación'
      operationId: submitPublicInvitation
      responses:
        201:
          description: 'Pedido creado'
  '/api/v1/public/forms/{publicKey}':
    get:
      tags:
        - 'Formularios públicos'
      summary: 'Consultar formulario público'
      operationId: showPublicCampaignForm
      responses:
        200:
          description: 'Formulario público obtenido'
  '/api/v1/public/forms/{publicKey}/submissions':
    post:
      tags:
        - 'Formularios públicos'
